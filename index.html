<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishi's QUiZ App</title>
    <style>
        body {
            background-image: url("Avengers.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh; 
        }
        .app {
            background-color: rgba(46, 125, 50, 0.9); /* Added transparency so background shows through */
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .app h1 {
            font-size: 25px;
            color: white;
            font-weight: 600;
            margin-top: 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }
        .quiz {
            padding: 10px 0;
        }
        .quiz h2 {
            font-size: 18px;
            color: white;
            font-weight: 600;
        }
        #answer-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            font-size: 16px;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 500;
            background-color: white;
            color: #333;
            border: none;
            text-align: left;
            transition: all 0.3s;
            width: 100%;
        }
        .btn:hover:not([disabled]) {
            background-color: #e2e8f0;
        }
        .btn.correct {
            background-color: #4caf50 !important;
            color: white;
        }
        .btn.incorrect {
            background-color: #f44336 !important;
            color: white;
        }
        .btn:disabled {
            cursor: no-drop;
        }
        .next-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            display: none;
            margin-left: auto;
            transition: all 0.3s;
        }
        .next-btn:hover {
            background-color: #0056b3;
        }
        .Welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: azure;
            z-index: 15;
            pointer-events: none;
            animation: fadeOut 3s ease-in-out forwards;
        }
        .Welcome-screen h1 {
            text-align: center;
            margin: 0;
            font-size: 50px;
            color: aqua;
            background-color: black;
            border-radius: 8px;
            padding: 15px 30px;
        }
        .Welcome-screen p {
            font-size: 20px;
            color: #333;
            margin-top: 15px;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
    <div class="Welcome-screen">
        <h1>Welcome to Rishi's QUiZ App</h1>
        <p>Test your knowledge with our quiz!</p>
    </div>
<div class="app">
    <h1>Rishi's QUiZ App</h1>
    <div class="quiz">
        <div id="timer-container" style="color: white; font-weight: bold; margin-bottom: 10px;">
        Time Left: <span id="time">15</span>s
    </div>
        <h2 id="question">Question Goes here</h2>
        <div id="answer-buttons">
            <!-- Dynamic answer buttons generated by JS -->
        </div>
        <button id="next-btn" class="next-btn">Next Question</button>
    </div>
</div> 

<script>
    const questions = [
        {
            question: "What is the largest animal in the world?",
            answers: [
                {text: "Elephant", correct: false},
                {text: "Shark", correct: false},
                {text: "Blue Whale", correct: true},
                {text: "Octopus", correct: false},
            ]
        },
        {
            question: "Which tall landmark/structure is located in Paris, France?",
            answers: [
                {text: "Tokyo Tower", correct: false},
                {text: "Eiffel Tower", correct: true},
                {text: "Mount Everest", correct: false},
                {text: "Taj Mahal", correct: false},
            ]
        },
        {
            question: "What is the highest mountain in the world above sea level?",
            answers: [
                {text: "Mount Fuji", correct: false},
                {text: "Mount Everest", correct: true},
                {text: "Kilimanjaro", correct: false},
                {text: "Kangchenjunga", correct: false},
            ]
        },
        {
            question: "What is the largest river in the world by water volume?",
            answers: [
                {text: "Yamuna", correct: false},
                {text: "Nile", correct: false},
                {text: "Amazon River", correct: true},
                {text: "Mississippi River", correct: false},
            ]
        },
        {
            question: "What is the largest lake in the world by water volume?",
            answers: [
                {text: "Lake Superior", correct: false},
                {text: "Caspian Sea", correct: true},
                {text: "Sambar Lake", correct: false},
                {text: "Wilber Lake", correct: false},
            ]
        },
        {
            question: "What is the smallest mountain height in the world above sea level?",
            answers: [
                {text: "Mount Fuji", correct: false},
                {text: "Mount Wycheproof", correct: true},
                {text: "Mount Everest", correct: false},
                {text: "Kilimanjaro", correct: false},
            ]
        },
        {
            question: "Which among the following is an active volcano?",
            answers: [
                {text: "Mount Fuji", correct: false},
                {text: "Mount Etna", correct: true},
                {text: "Narcondom Island", correct: false},
                {text: "Mauna Kea", correct: false},
            ]
        },
        {
            question: "Which planet in our solar system has the most moons?",
            answers: [
                {text: "Saturn", correct: true},
                {text: "Neptune", correct: false},
                {text: "Jupiter", correct: false},
                {text: "Uranus", correct: false},
            ]
        },
        {
            question: "Who painted the ceiling of the Sistine Chapel in Vatican City?",
            answers: [
                {text: "Raphael", correct: false},
                {text: "Donatello", correct: false},
                {text: "Michelangelo Buonarroti", correct: true},
                {text: "Leonardo Da Vinci", correct: false},
            ]
        },
        {
            question: "What is the chemical symbol for gold?",
            answers: [
                {text: "Al", correct: false},
                {text: "Ag", correct: false},
                {text: "Au", correct: true},
                {text: "Sn", correct: false},
            ]
        },
        {
            question: "In which year did the RMS Titanic sink in the North Atlantic Ocean?",
            answers: [
                {text: "1905", correct: false},
                {text: "1912", correct: true},
                {text: "1915", correct: false},
                {text: "1920", correct: false},
            ]
        },
    ];
    const questionElement = document.getElementById("question");
    const answerButtons = document.getElementById("answer-buttons");
    const nextButton = document.getElementById("next-btn");
    const timerContainer = document.getElementById("timer-container");
    const timeElement = document.getElementById("time");

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    let timeLeft = 15;

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        timerContainer.style.display = "block";
        nextButton.innerHTML = "Next Question";
        showQuestion();
    }

    function resetState() {
        clearInterval(timer);
        nextButton.style.display = "none";
        while (answerButtons.firstChild) {
            answerButtons.removeChild(answerButtons.firstChild);
        }
    }

    function showQuestion() {
        resetState();
        let currentQuestion = questions[currentQuestionIndex];
        let questionNo = currentQuestionIndex + 1;
        questionElement.innerHTML = questionNo + ". " + currentQuestion.question; 

        currentQuestion.answers.forEach(answer => {
            const button = document.createElement("button");
            button.innerHTML = answer.text;
            button.classList.add("btn");
            answerButtons.appendChild(button);
            
            if (answer.correct) {
                button.dataset.correct = answer.correct;
            }
            button.addEventListener("click", selectAnswer);
        });

        startTimer();
    }

    function startTimer() {
        timeLeft = 15;
        timeElement.innerHTML = timeLeft;

        timer = setInterval(() => {
            timeLeft--;
            timeElement.innerHTML = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                handleTimeOut();
            }
        }, 1000);
    }

    function handleTimeOut() {
        Array.from(answerButtons.children).forEach(button => {
            if (button.dataset.correct === "true") {
                button.classList.add("correct");
            }
            button.disabled = true;
        });
        nextButton.style.display = "block";
    }

    function selectAnswer(e) {
        clearInterval(timer);
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === "true";

        if (isCorrect) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("incorrect");
        }

        Array.from(answerButtons.children).forEach(button => {
            if (button.dataset.correct === "true") {
                button.classList.add("correct");
            }
            button.disabled = true;
        });

        nextButton.style.display = "block";
    }

    function showScore() {
        resetState();
        timerContainer.style.display = "none";
        questionElement.innerHTML = `You scored ${score} out of ${questions.length}!`;
        nextButton.innerHTML = "Play Again";
        nextButton.style.display = "block";
    }

    function handleNextButton() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            showQuestion();
        } else {
            showScore();
        }
    }

    nextButton.addEventListener("click", () => {
        if (currentQuestionIndex < questions.length) {
            handleNextButton();
        } else {
            startQuiz();
        }
    });

    startQuiz();
</script>
</body>
</html>
